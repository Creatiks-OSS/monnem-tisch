# Laravel 12 — Nixpacks (Coolify / Railway)

[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
  "npm ci",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --force && php artisan config:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=80"
