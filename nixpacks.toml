# Laravel 12 — Nixpacks (Coolify / Railway)

[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
  "npm ci",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --no-interaction --force && php artisan config:cache && php artisan view:cache && cd public && exec php -d upload_max_filesize=20M -d post_max_size=64M -d memory_limit=256M -S 0.0.0.0:80 ../deploy/server.php"
